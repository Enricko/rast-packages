[package]
name = "rast-ai-agent"
version = "1.7.0"
edition = "2021"
rust-version = "1.94"
description = "AI Agent: RAST's agent harness, an App Center app package"
license = "MIT"
repository = "https://github.com/Enricko/rast-packages"
publish = false

[lib]
name = "rast_ai_agent"
path = "src/lib.rs"

[[bin]]
name = "rast-ai-agent"
path = "src/main.rs"

[dependencies]
# RAST's library: accounts, the audit log, the sandbox, the app host. Pinned
# to the RAST commit this AI Agent builds against (RAST_REV in the workflow
# reads it from here).
rast = { git = "https://github.com/Enricko/rast", rev = "6d716714e7ef502d33048d294338b6aade853561" }
axum = { version = "0.8.9", features = ["macros", "ws"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time", "signal", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-http = { version = "0.7", features = ["trace", "cors", "compression-gzip", "request-id"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive"] }
argon2 = "0.6.0"
rand = "0.9"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
base64 = "0.22"
hex = "0.4"
aes-gcm = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
clap = { version = "4.6", features = ["derive", "env"] }
sysinfo = "0.40"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
mime_guess = "2"
percent-encoding = "2"
rust-embed = { version = "8", features = ["include-exclude"] }
ipnet = "2"
walkdir = "2"
flate2 = "1"
tar = "0.4"
xz2 = "0.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
ring = "0.17"
async-trait = "0.1"
socket2 = "0.6"
libc = "0.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
notify = "8.2.2"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 1
