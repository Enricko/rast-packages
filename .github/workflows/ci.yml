name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # RAST release that ships the Rust catalog commands.
  RAST_VERSION: "0.11.6"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install the RAST catalog tool
        run: |
          set -euo pipefail
          mkdir -p bin
          curl -fsSL -o bin/rast \
            "https://github.com/Enricko/rast/releases/download/v${RAST_VERSION}/rast-linux-x86_64"
          chmod +x bin/rast
          ./bin/rast version
      - name: Published catalog verifies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./bin/rast catalog previous --out work/previous
          if [ -f work/previous/catalog.json ]; then
            ./bin/rast catalog check work/previous/catalog.json
          fi
