name: AI Agent

# AI Agent's App Center package (`ai-agent`), from apps/ai-agent: tests on
# every change to it; on a tag `ai-agent-v<version>` (or by hand) its window
# bundle and server program, natively on x86_64 and aarch64, published as
# the release of that tag here. The catalog workflow finds these releases
# (packages.ai-agent.releaseRepos), verifies them and lists them in the
# signed catalog.
#
# The crate builds against the RAST commit pinned in apps/ai-agent/Cargo.toml
# (`rast = { git, rev }`); the window builds with RAST's frontend at that
# commit (scripts/build-ui.sh).
#
# Release: bump `VERSION` in apps/ai-agent/src/app.rs and `version` in its
# Cargo.toml, add the version's notes to ui/whats-new.ts and CHANGELOG.md,
# then push the tag `ai-agent-v<that version>`.

on:
  push:
    branches: [main]
    tags: ["ai-agent-v*"]
    paths:
      - "apps/ai-agent/**"
      - ".github/workflows/ai-agent.yml"
  pull_request:
    paths:
      - "apps/ai-agent/**"
      - ".github/workflows/ai-agent.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "AI Agent version to release, without the prefix (e.g. 1.4.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-agent-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    working-directory: apps/ai-agent

jobs:
  prepare:
    name: Versions and RAST commit
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      rast_rev: ${{ steps.rast.outputs.rev }}
      toolchain: ${{ steps.rast.outputs.toolchain }}
    steps:
      - uses: actions/checkout@v5
      - name: The pinned RAST commit and toolchain
        id: rast
        run: |
          set -euo pipefail
          rev=$(sed -n 's/^rast = { git = "https:\/\/github.com\/Enricko\/rast", rev = "\([0-9a-f]\{40\}\)" }$/\1/p' Cargo.toml)
          test -n "$rev" || { echo "Cargo.toml pins no RAST commit" >&2; exit 1; }
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "toolchain=$channel" >> "$GITHUB_OUTPUT"
      - name: Determine and check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          source_version=$(sed -n 's/^pub const VERSION: &str = "\([^"]*\)";/\1/p' src/app.rs)
          crate_version=$(sed -n '0,/^version = /s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          if [[ "$source_version" != "$crate_version" ]]; then
            echo "src/app.rs says $source_version, Cargo.toml says $crate_version" >&2
            exit 1
          fi
          grep -q "version: \"$source_version\"" ui/whats-new.ts || {
            echo "ui/whats-new.ts has no notes for $source_version" >&2
            exit 1
          }
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/ai-agent-v* ]]; then
            version="${GITHUB_REF_NAME#ai-agent-v}"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=$source_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a version: '$version'" >&2
            exit 1
          fi
          if [[ "$source_version" != "$version" ]]; then
            echo "src/app.rs says $source_version, the release is $version" >&2
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=ai-agent-v$version" >> "$GITHUB_OUTPUT"

  test:
    name: Tests
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ needs.prepare.outputs.toolchain }}" \
            --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/ai-agent
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets

  window:
    name: Window
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: RAST at the pinned commit
        uses: actions/checkout@v5
        with:
          repository: Enricko/rast
          ref: ${{ needs.prepare.outputs.rast_rev }}
          path: rast-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rast-src/frontend/package-lock.json
      - name: Install RAST's frontend dependencies
        working-directory: rast-src/frontend
        run: npm ci
      - name: Check, test and bundle the window
        run: scripts/build-ui.sh ../../rast-src ui-build
      - uses: actions/upload-artifact@v4
        with:
          name: ai-agent-ui
          path: apps/ai-agent/ui-build
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.arch }}
    needs: [prepare, test, window]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 on Ubuntu 22.04 (glibc 2.35), like RAST's own release.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: rustup toolchain install "${{ needs.prepare.outputs.toolchain }}" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/ai-agent
      - name: Build the server program
        run: cargo build --release --locked --bin rast-ai-agent
      - uses: actions/download-artifact@v4
        with:
          name: ai-agent-ui
          path: apps/ai-agent/ai-agent/ui
      - name: Assemble and smoke-test the package archive
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          mkdir -p ai-agent/bin
          cp target/release/rast-ai-agent ai-agent/bin/rast-ai-agent
          chmod 0755 ai-agent/bin/rast-ai-agent
          cp ../../LICENSE ai-agent/LICENSE
          cp THIRD-PARTY-NOTICES.md ai-agent/THIRD-PARTY-NOTICES.md
          reported=$(./ai-agent/bin/rast-ai-agent --version)
          echo "$reported"
          [[ "$reported" == "rast-ai-agent $version "* ]]
          # Without RAST it says what it needs and stops.
          if env -i ./ai-agent/bin/rast-ai-agent >said.txt 2>&1; then
            echo "the server started without RAST" >&2
            exit 1
          fi
          grep -q "RAST_APP_SOCKET is not set" said.txt
          archive="ai-agent-${version}-linux-${{ matrix.arch }}.tar.gz"
          tar --owner=0 --group=0 --numeric-owner -czf "$archive" ai-agent
          tar -tzf "$archive"
          echo "ARCHIVE=apps/ai-agent/$archive" >> "$GITHUB_ENV"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ARCHIVE }}
      - uses: actions/upload-artifact@v4
        with:
          name: ai-agent-linux-${{ matrix.arch }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ai-agent-linux-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ai-agent-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 2
      - name: Attest SHA256SUMS
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/SHA256SUMS
      - name: Publish (not marked latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          tag="${{ needs.prepare.outputs.tag }}"
          notes="AI Agent ${version} for RAST's App Center (package ai-agent). Installed and updated from App Center; RAST 0.9.17 or later. Built against RAST ${{ needs.prepare.outputs.rast_rev }}."
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "AI Agent ${version}" --notes "$notes" --latest=false
