name: catalog

# Discover upstream releases, verify or build them, smoke-test them on native
# x86_64 and aarch64 runners, then publish a signed catalog. New versions are
# announced first ("detected", state verifying/building) and only become
# installable in the final catalog after every check passed.
#
# All catalog logic lives in the Rust `rast catalog` commands.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      withhold:
        description: "Versions to withhold, comma separated (e.g. go@1.26.11,nodejs@24.22.2)"
        required: false
        default: ""
      force:
        description: "Re-verify versions that are already in the catalog"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: catalog
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  # RAST release that ships the Rust catalog commands.
  RAST_VERSION: "0.11.10"

jobs:
  discover:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      has_new: ${{ steps.plan.outputs.has_new }}
      has_verify: ${{ steps.plan.outputs.has_verify }}
      has_php: ${{ steps.plan.outputs.has_php }}
      verify_matrix: ${{ steps.plan.outputs.verify_matrix }}
      php_matrix: ${{ steps.plan.outputs.php_matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: Install the RAST catalog tool
        run: |
          set -euo pipefail
          mkdir -p bin
          curl -fsSL -o bin/rast \
            "https://github.com/Enricko/rast/releases/download/v${RAST_VERSION}/rast-linux-x86_64"
          chmod +x bin/rast
          ./bin/rast version
      - name: Fetch and verify the published catalog
        run: ./bin/rast catalog previous --out work/previous
      - name: Discover upstream versions
        id: plan
        run: >
          ./bin/rast catalog discover --previous work/previous --out work/plan.json
          --withhold "${{ inputs.withhold }}" ${{ inputs.force && '--force' || '' }}
          --github-output "$GITHUB_OUTPUT"
      - name: Announce new upstream versions (detected, not yet installable)
        if: steps.plan.outputs.has_new == 'true'
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          ./bin/rast catalog interim --plan work/plan.json --previous work/previous --out work/interim/catalog.json
          ./bin/rast catalog sign work/interim/catalog.json
          ./bin/rast catalog check work/interim/catalog.json --previous work/previous
          gh release view catalog >/dev/null 2>&1 || gh release create catalog --title "Catalog" \
            --notes "Signed RAST package catalog (catalog.json + catalog.json.sig). Updated by the catalog workflow." --latest=false
          # Signature first: a client that races the upload sees an old
          # signature over new bytes and simply retries at its next check.
          gh release upload catalog work/interim/catalog.json.sig work/interim/catalog.json --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            work/plan.json
            work/previous

  verify:
    needs: discover
    if: needs.discover.outputs.has_verify == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.verify_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install the RAST catalog tool
        run: |
          set -euo pipefail
          mkdir -p bin
          arch=${{ startsWith(matrix.runner, 'ubuntu-24.04-arm') && 'aarch64' || 'x86_64' }}
          curl -fsSL -o bin/rast \
            "https://github.com/Enricko/rast/releases/download/v${RAST_VERSION}/rast-linux-${arch}"
          chmod +x bin/rast
          ./bin/rast version
      - uses: actions/download-artifact@v5
        with:
          name: plan
          path: work
      - name: Download, verify and run upstream artifacts (${{ matrix.target }})
        run: ./bin/rast catalog verify --plan work/plan.json --target ${{ matrix.target }} --out results/upstream-${{ matrix.target }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: results-upstream-${{ matrix.target }}
          path: results/

  php:
    needs: discover
    if: needs.discover.outputs.has_php == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.php_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install the RAST catalog tool
        run: |
          set -euo pipefail
          mkdir -p bin
          arch=${{ startsWith(matrix.runner, 'ubuntu-24.04-arm') && 'aarch64' || 'x86_64' }}
          curl -fsSL -o bin/rast \
            "https://github.com/Enricko/rast/releases/download/v${RAST_VERSION}/rast-linux-${arch}"
          chmod +x bin/rast
          ./bin/rast version
      - uses: actions/download-artifact@v5
        with:
          name: plan
          path: work
      - name: Read build inputs
        id: inputs
        run: ./bin/rast catalog php-inputs --plan work/plan.json --version "${{ matrix.version }}"
      - name: Build PHP ${{ matrix.version }} (${{ matrix.target }})
        id: build
        run: |
          ./bin/rast catalog build-php --version "${{ matrix.version }}" --target "${{ matrix.target }}" \
            --source-sha256 "${{ steps.inputs.outputs.sha }}" \
            --extensions "${{ steps.inputs.outputs.extensions }}" \
            --spc-version "${{ steps.inputs.outputs.spc }}" \
            --builder "${{ steps.inputs.outputs.builder }}" \
            --out dist
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.build.outputs.archive }}
      - name: Smoke test and record
        run: >
          ./bin/rast catalog php-result --archive "${{ steps.build.outputs.archive }}"
          --version "${{ matrix.version }}" --target "${{ matrix.target }}"
          --attestation-url "${{ steps.attest.outputs.attestation-url }}"
          --out results/php-${{ matrix.version }}-${{ matrix.target }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.version }}-${{ matrix.target }}
          path: |
            dist/
            results/

  publish:
    needs: [discover, verify, php]
    if: ${{ !cancelled() && needs.discover.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install the RAST catalog tool
        run: |
          set -euo pipefail
          mkdir -p bin
          curl -fsSL -o bin/rast \
            "https://github.com/Enricko/rast/releases/download/v${RAST_VERSION}/rast-linux-x86_64"
          chmod +x bin/rast
          ./bin/rast version
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Collect results
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: ./bin/rast catalog collect --artifacts artifacts --work work --verify-result "$VERIFY_RESULT"
      - name: Publish PHP builds as releases
        id: php
        run: ./bin/rast catalog php-publish --results work/results --archives work/php-dist --github-output "$GITHUB_OUTPUT"
      - name: Assemble, sign and check the catalog
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          ./bin/rast catalog assemble --plan work/plan.json --previous work/previous \
            --results work/results --php-releases '${{ steps.php.outputs.releases }}' --out work/out/catalog.json
          ./bin/rast catalog check work/out/catalog.json --previous work/previous --download new
          ./bin/rast catalog sign work/out/catalog.json
          ./bin/rast catalog check work/out/catalog.json
      - name: Publish the signed catalog
        run: |
          set -euo pipefail
          gh release view catalog >/dev/null 2>&1 || gh release create catalog --title "Catalog" \
            --notes "Signed RAST package catalog (catalog.json + catalog.json.sig). Updated by the catalog workflow." --latest=false
          seq=$(./bin/rast catalog sequence work/out/catalog.json | tail -n 1)
          cp work/out/catalog.json "work/out/catalog-$seq.json"
          gh release upload catalog work/out/catalog.json.sig work/out/catalog.json "work/out/catalog-$seq.json" --clobber
          echo "Published catalog sequence $seq" >> "$GITHUB_STEP_SUMMARY"
